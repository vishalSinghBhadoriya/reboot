name: Deploy REBOOT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - run: npm test
      - name: Build Pages site
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm run build -- --base "${PAGES_BASE%/}/"
          node --experimental-strip-types scripts/prepare-pages.mjs "${PAGES_URL%/}/"
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy the uploaded Pages artifact
        id: deployment
        uses: actions/github-script@v8
        timeout-minutes: 6
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Use the registered upload ID because the Pages action could not list this run's artifact by name.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return a valid artifact ID.');
            }
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id ?? deployment.status_url?.split('/').pop() ?? context.sha;
            const failed = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 50; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo,
                deployment_id: deploymentId,
              });
              core.info('Pages status: ' + data.status);
              if (data.status === 'succeed') return;
              if (failed.has(data.status)) throw new Error('Pages deployment ended with ' + data.status);
              await new Promise(resolve => setTimeout(resolve, 6000));
            }
            throw new Error('Timed out waiting for GitHub Pages to deploy.');
